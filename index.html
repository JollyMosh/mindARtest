<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./markers.mind; maxTrack: 2"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>

      <a-asset-item
        id="Miku"
        src="./Miku/scene.gltf">
      </a-asset-item>

      <a-asset-item
        id="Teto"
        src="./scene.gltf">
      </a-asset-item>

      <audio
        id="audioMiku"
        src="./Miku/miku_dayo.mp3"
        preload="auto">
      </audio>

      <audio
        id="audioTeto"
        src="./teto.mp3"
        preload="auto">
      </audio>

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- ========================= -->
    <!-- MIKU -->
    <!-- ========================= -->

    <a-entity mindar-image-target="targetIndex: 0">

      <a-gltf-model
        id="Miku-plush"
        class="clickable"
        rotation="0 0 0"
        position="0 0 0.1"
        scale="1 1 1"
        src="#Miku"
        animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
      </a-gltf-model>

    </a-entity>


    <!-- ========================= -->
    <!-- TETO -->
    <!-- ========================= -->

    <a-entity mindar-image-target="targetIndex: 1">

      <a-gltf-model
        id="Teto-plush"
        class="clickable"
        rotation="0 0 0"
        position="0 0 0.1"
        scale="0.05 0.05 0.05"
        src="#Teto"
        animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
      </a-gltf-model>

    </a-entity>

  </a-scene>


  <script>

    document.addEventListener('DOMContentLoaded', function () {

      const scene = document.querySelector('a-scene');


      function iniciar() {

        console.log('A-FRAME LISTO');

        const MikuPlush = document.querySelector('#Miku-plush');
        const audioMiku = document.querySelector('#audioMiku');

        console.log('Miku:', MikuPlush);
        console.log('Audio:', audioMiku);


        // ==========================================
        // ESPERAR A QUE EL MODELO 3D ESTÉ LISTO
        // ==========================================

        MikuPlush.addEventListener('model-loaded', function () {

          console.log('MODELO DE MIKU CARGADO');

        });


        // ==========================================
        // TOUCH DIRECTO SOBRE LA PANTALLA
        // ==========================================

        scene.addEventListener('touchstart', function (event) {

          console.log('TOUCH EN LA ESCENA');

          const touch = event.touches[0];

          const rect = scene.canvas.getBoundingClientRect();

          // Convertimos la posición del dedo a coordenadas -1 a 1
          const mouse = new THREE.Vector2();

          mouse.x =
            ((touch.clientX - rect.left) / rect.width) * 2 - 1;

          mouse.y =
            -((touch.clientY - rect.top) / rect.height) * 2 + 1;


          // ==========================================
          // RAYCASTER
          // ==========================================

          const camera = scene.camera;

          const raycaster = new THREE.Raycaster();

          raycaster.setFromCamera(mouse, camera);


          // Buscamos los objetos 3D de Miku
          const objetosMiku = [];

          MikuPlush.object3D.traverse(function (obj) {

            if (obj.isMesh) {
              objetosMiku.push(obj);
            }

          });


          const intersecciones =
            raycaster.intersectObjects(objetosMiku, true);


          console.log(
            'Objetos tocados:',
            intersecciones.length
          );


          // ==========================================
          // SI TOCÓ MIKU
          // ==========================================

          if (intersecciones.length > 0) {

            alert('¡TOCASTE A MIKU!');

            console.log('CLICK EN MIKU');


            audioMiku.pause();

            audioMiku.currentTime = 0;


            audioMiku.play()
              .then(function () {

                console.log(
                  'AUDIO DE MIKU REPRODUCIÉNDOSE'
                );

              })
              .catch(function (error) {

                console.error(
                  'ERROR REPRODUCIENDO MIKU:',
                  error
                );

              });

          }

        });


        console.log('EVENTO TOUCH REGISTRADO');

      }


      // Si A-Frame todavía no terminó de cargar
      if (!scene.hasLoaded) {

        scene.addEventListener('loaded', iniciar);

      } else {

        // Si ya cargó antes de que llegáramos aquí
        iniciar();

      }

    });

  </script>

</body>
</html>
