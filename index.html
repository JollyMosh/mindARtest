<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./markers.mind; maxTrack: 2"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item
        id="Miku"
        src="./Miku/scene.gltf">
      </a-asset-item>

      <a-asset-item
        id="Teto"
        src="./scene.gltf">
      </a-asset-item>

      <!-- Precargamos los audios -->
      <audio id="audioMiku" src="./Miku/miku_dayo.mp3" preload="auto"></audio>
      <audio id="audioTeto" src="./teto.mp3" preload="auto"></audio>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="rayOrigin: mouse"
      raycaster="far: 100; objects: .clickable">
    </a-camera>

    <!-- Miku -->
    <a-entity mindar-image-target="targetIndex: 0">

      <a-gltf-model
        id="Miku-plush"
        class="clickable"
        rotation="0 0 0"
        position="0 0 0.1"
        scale="1 1 1"
        src="#Miku"
        animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
      </a-gltf-model>
      <script>
    document.addEventListener('touchstart', function () { alert('¡TOUCH FUNCIONA!'); }, { once: true });
    document.addEventListener('DOMContentLoaded', () => {
      alert('de verdad si funciona');
      const MikuPlush = document.querySelector('#Miku-plush');
      

      const audioMiku = document.querySelector('#audioMiku');
      


      // ==========================================
      // MIKU
      // ==========================================

      MikuPlush.addEventListener('click', () => {

        console.log('CLICK EN MIKU');

        audioMiku.pause();
        audioMiku.currentTime = 0;

        audioMiku.play().catch(error => {
          console.error('Error reproduciendo Miku:', error);
        });

      });


      console.log('Eventos de Miku y Teto registrados');

    });

  </script>

    </a-entity>

    <!-- Teto -->
    <a-entity mindar-image-target="targetIndex: 1">

      <a-gltf-model
        id="Teto-plush"
        class="clickable"
        rotation="0 0 0"
        position="0 0 0.1"
        scale="0.05 0.05 0.05"
        src="#Teto"
        animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
      </a-gltf-model>

    </a-entity>

  </a-scene>


  

</body>
</html>
